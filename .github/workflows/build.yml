name: Build and deploy slide decks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        deck: [seattle-2026, torino-2026]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.deck }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        env:
          # playwright-chromium is only needed for local PDF export; skip the
          # browser download (unsupported on the ubuntu-latest runner image)
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
        working-directory: ${{ matrix.deck }}

      - name: Build slides
        run: npx slidev build --out dist --base /seminars/${{ matrix.deck }}/
        working-directory: ${{ matrix.deck }}

      - name: Copy static assets into dist
        run: |
          cp -rL images dist/images
          [ -f pipeline.svg ] && cp pipeline.svg dist/ || true
        working-directory: ${{ matrix.deck }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.deck }}
          path: ${{ matrix.deck }}/dist
          if-no-files-found: error

  build-verso:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        deck: [stanford-2026]

    steps:
      - uses: actions/checkout@v4

      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: ${{ matrix.deck }}
          test: false

      - name: Build slides
        run: lake exe slides  # writes _slides/
        working-directory: ${{ matrix.deck }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.deck }}
          path: ${{ matrix.deck }}/_slides
          if-no-files-found: error

  deploy:
    needs: [build, build-verso]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Add index page
        run: mkdir -p pages && cp index.html pages/

      - name: Download seattle-2026
        uses: actions/download-artifact@v4
        with:
          name: seattle-2026
          path: pages/seattle-2026

      - name: Download torino-2026
        uses: actions/download-artifact@v4
        with:
          name: torino-2026
          path: pages/torino-2026

      - name: Download stanford-2026
        uses: actions/download-artifact@v4
        with:
          name: stanford-2026
          path: pages/stanford-2026

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
