<path d="M624.9363333333333,442 H722.2283333333334 Q726.2283333333334,442 726.2283333333334,446 V460 Q726.2283333333334,464 722.2283333333334,464 H624.9363333333333 Z" fill="url(#hatch-grey)"/>
<text x="734.2283333333334" y="458" fill="#475569" font-size="14">42.4k code + 13.2k tables</text>
<text x="20" y="546" fill="#64748b" font-size="12.5">Also used: the EllipticCurve library (1.1k definitions, 6.8k proofs). Not translated: SIMD backends and optional features.</text>
<text x="20" y="564" fill="#64748b" font-size="12.5">Not shown: models of subtle and zeroize (to be proven separately) and of the Rust std library (moving into Aeneas).</text>
<text x="20" y="582" fill="#64748b" font-size="12.5">Lines: non-blank, non-comment; imports, namespaces and axiom checks not counted.</text>
